<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta
  name="description"
  content="CERANIX PDC MLCC solutions for high-voltage, safety, automotive and industrial applications."
>

<title>CERANIX | PDC MLCC 솔루션</title>

<style>
:root {
  --navy:#062b63;
  --blue:#009fe3;
  --light:#f6f9fc;
  --text:#1a1a1a;
  --muted:#667085;
  --line:#d9e2ec;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  font-family:
    "Pretendard",
    "Noto Sans KR",
    "Segoe UI",
    Arial,
    sans-serif;

  line-height:1.65;
  color:var(--text);
  background:#fff;
}

a {
  color:inherit;
  text-decoration:none;
}

.container {
  width:min(1120px, calc(100% - 40px));
  margin:auto;
}

/* Header */

header {
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

nav {
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.logo {
  width:210px;
  max-height:48px;
  object-fit:contain;
  object-position:left center;
}

.nav-links {
  display:flex;
  align-items:center;
  gap:28px;
  list-style:none;
  font-weight:700;
  font-size:14px;
}

.nav-links a:hover,
.nav-links a.active {
  color:var(--blue);
}

/* Language switch */

.lang-switch {
  display:flex;
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px;
  background:#f7f9fc;
}

.lang-btn {
  border:0;
  background:transparent;
  padding:7px 11px;
  border-radius:999px;
  cursor:pointer;
  font-weight:800;
  color:var(--muted);
}

.lang-btn.active {
  color:#fff;
  background:var(--navy);
}

/* Hero */

.hero {
  color:#fff;
  padding:105px 20px;
  text-align:center;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(0,184,255,.34),
      transparent 36%
    ),
    linear-gradient(
      135deg,
      #041c43,
      #073979 65%,
      #086ca4
    );
}

.hero h1 {
  font-size:clamp(44px,7vw,72px);
  line-height:1.1;
}

.subtitle {
  font-size:clamp(18px,2.3vw,24px);
  color:#dcecff;
  margin:18px auto 0;
  max-width:820px;
}

.subtitle-line {
  display:block;
}

.eyebrow {
  display:inline-block;
  margin-bottom:20px;
  padding:7px 14px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  background:rgba(255,255,255,.08);
  font-weight:800;
}

/* Sections */

section {
  padding:78px 0;
}

section.alt {
  background:var(--light);
}

h2 {
  color:var(--navy);
  margin-bottom:18px;
  font-size:clamp(29px,4vw,38px);
}

.lead {
  color:var(--muted);
  max-width:900px;
}

/* Product cards */

.card-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
  margin-top:32px;
}

.product-link {
  display:block;
  height:100%;
}

.card {
  height:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:30px;
  box-shadow:0 8px 24px rgba(25,52,84,.06);

  transition:
    transform .25s,
    border-color .25s,
    box-shadow .25s;
}

.product-link:hover .card,
.card:hover {
  transform:translateY(-4px);
  border-color:var(--blue);
  box-shadow:0 14px 30px rgba(25,52,84,.11);
}

.card h3 {
  color:var(--navy);
  margin-bottom:12px;
}

.card ul {
  padding-left:20px;
  color:var(--muted);
}

.card-action {
  display:inline-block;
  margin-top:18px;
  color:var(--blue);
  font-weight:800;
  font-size:14px;
}

/* Product table */

.table-wrap {
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
  min-width:720px;
}

th {
  background:var(--navy);
  color:#fff;
}

th,
td {
  padding:14px;
  text-align:left;
  border-bottom:1px solid var(--line);
}

td {
  color:#4d5b6c;
}

/* Applications */

.application-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-top:28px;
}

.application {
  background:linear-gradient(
    135deg,
    var(--navy),
    #0a5f9e
  );

  color:#fff;
  padding:22px 18px;
  text-align:center;
  border-radius:10px;
  font-weight:800;
}

/* Contact */

.contact-box {
  background:var(--light);
  border:1px solid var(--line);
  border-radius:14px;
  padding:42px;
  text-align:center;
}

.contact-box p {
  color:var(--muted);
  max-width:680px;
  margin:auto;
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:24px;
  background:var(--blue);
  color:#fff;
  padding:13px 26px;
  border-radius:7px;
  font-weight:800;
}

.btn:hover {
  background:#0089c4;
}

.notice {
  margin-top:22px;
  padding:16px 18px;
  border-left:4px solid var(--blue);
  background:#f7fbfe;
  color:var(--muted);
  font-size:14px;
}

footer {
  background:#03172f;
  color:#c9d5e3;
  text-align:center;
  padding:26px;
}

/* Languages */

[data-lang] {
  display:none;
}

html[lang="ko"] [data-lang="ko"],
html[lang="en"] [data-lang="en"] {
  display:initial
